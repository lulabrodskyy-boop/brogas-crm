<html lang="es">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Arial,sans-serif; background:#f0f2f5; color:#1a1a2e; }

.header { background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); color:white; padding:18px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; box-shadow:0 4px 12px rgba(0,0,0,.15); }
.header h1 { font-size:22px; font-weight:700; }
.header .sub { font-size:11.5px; opacity:.6; margin-top:3px; }
.stats { display:flex; gap:10px; flex-wrap:wrap; }
.sbox { background:rgba(255,255,255,.1); border-radius:9px; padding:9px 15px; text-align:center; min-width:68px; }
.sbox .n { font-size:22px; font-weight:700; }
.sbox .l { font-size:9.5px; opacity:.7; text-transform:uppercase; letter-spacing:.6px; }
.sbox.or { background:rgba(230,81,0,.3); }
.sbox.pu { background:rgba(106,27,154,.3); }
.sbox.go { background:rgba(245,127,23,.35); }

.tabs { display:flex; background:white; border-bottom:3px solid #e0e0e0; padding:0 32px; overflow-x:auto; }
.tab { padding:13px 20px; cursor:pointer; font-size:13px; font-weight:600; color:#999; border-bottom:3px solid transparent; margin-bottom:-3px; transition:all .2s; display:flex; align-items:center; gap:7px; white-space:nowrap; }
.tab:hover { color:#0f3460; background:#f5f7ff; }
.tab.active { color:#0f3460; border-bottom-color:#0f3460; }
.cnt { background:#eee; color:#555; border-radius:20px; padding:2px 8px; font-size:11px; font-weight:700; }
.tab.active .cnt { background:#0f3460; color:white; }

.controls { padding:11px 32px; display:flex; gap:9px; align-items:center; flex-wrap:wrap; background:white; border-bottom:1px solid #e8e8e8; }
.search-box { flex:1; min-width:190px; padding:8px 13px; border:2px solid #e0e0e0; border-radius:8px; font-size:13px; transition:border-color .2s; }
.search-box:focus { outline:none; border-color:#0f3460; }
select.filter { padding:8px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:12.5px; background:white; cursor:pointer; color:#444; }

.table-container { padding:14px 32px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.07); }
thead { background:#1a1a2e; color:white; }
th { padding:11px 12px; text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:600; white-space:nowrap; }
td { padding:10px 12px; font-size:12.5px; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover { background:#f8f9ff; }
tr.row-conv { background:#fffde7; }
tr.row-conv:hover { background:#fff9c4; }

.badge { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap; }
.b-nuevo       { background:#e3f2fd; color:#1565c0; }
.b-enviado     { background:#fff3e0; color:#e65100; }
.b-seguimiento { background:#f3e5f5; color:#6a1b9a; }
.b-convertido  { background:#e8f5e9; color:#2e7d32; }
.b-prov        { background:#f5f5f5; color:#555; }

.btn { padding:7px 13px; border:none; border-radius:7px; cursor:pointer; font-size:11.5px; font-weight:600; transition:all .18s; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; text-decoration:none; }
.btn-enviar   { background:#dbeafe; color:#1d4ed8; border:1.5px solid #93c5fd; }
.btn-enviar:hover   { background:#bfdbfe; }
.btn-contacto { background:#f3e5f5; color:#6a1b9a; border:1.5px solid #ce93d8; }
.btn-contacto:hover { background:#e1bee7; }
.btn-conv     { background:#dcfce7; color:#166534; border:1.5px solid #86efac; }
.btn-conv:hover     { background:#bbf7d0; }
.btn-edit     { background:#fef9c3; color:#854d0e; border:1.5px solid #fde047; font-size:10.5px; padding:5px 10px; }
.btn-copy     { background:#f5f5f5; color:#444; border:1.5px solid #ddd; }
.btn-copy:hover     { background:#eee; }
.btn-copy.copied    { background:#166534; color:white; border-color:#166534; }
.btn-wpp      { background:#25D366; color:white; }
.btn-wpp:hover      { background:#16a34a; }
.actions { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.action-col { min-width:140px; }

.sel-vend { padding:5px 7px; border:2px solid #dbeafe; border-radius:6px; font-size:11px; font-weight:600; color:#1d4ed8; background:#dbeafe; cursor:pointer; min-width:155px; }
.sel-vend:focus { outline:none; border-color:#1d4ed8; }
.sel-vend.ov { background:#fff3e0; border-color:#f57c00; color:#c2410c; }
.ov-label { font-size:9.5px; color:#f57c00; margin-top:2px; }

.ap { font-weight:600; }
.nm { color:#777; font-size:11px; }
.cc { max-width:160px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.cc:hover { white-space:normal; overflow:visible; background:#fffde7; position:relative; z-index:10; border-radius:4px; padding:2px 4px; }

.cv-monto { font-weight:700; color:#166534; }
.cv-fecha  { font-size:11px; color:#777; margin-top:2px; }

.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; align-items:center; justify-content:center; }
.modal-bg.open { display:flex; }
.modal { background:white; border-radius:16px; padding:30px; width:380px; box-shadow:0 20px 60px rgba(0,0,0,.2); animation:pop .2s ease; }
@keyframes pop { from{transform:scale(.88);opacity:0} to{transform:scale(1);opacity:1} }
.modal h3 { font-size:17px; margin-bottom:4px; }
.modal .msub { font-size:12px; color:#888; margin-bottom:16px; }
.modal label { display:block; font-size:11.5px; font-weight:600; color:#555; margin:12px 0 4px; }
.modal input { width:100%; padding:9px 13px; border:2px solid #e0e0e0; border-radius:8px; font-size:13.5px; font-family:inherit; transition:border-color .2s; }
.modal input:focus { outline:none; border-color:#0f3460; }
.modal-btns { display:flex; gap:9px; margin-top:20px; justify-content:flex-end; }
.btn-ok { background:#166534; color:white; padding:9px 20px; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; }
.btn-ok:hover { background:#14532d; }
.btn-cancel { background:#f5f5f5; color:#555; padding:9px 16px; border:1.5px solid #ddd; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }

.toast { position:fixed; bottom:24px; right:24px; background:#1a1a2e; color:white; padding:11px 20px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.2); transform:translateY(70px); opacity:0; transition:all .25s ease; z-index:2000; }
.toast.show { transform:translateY(0); opacity:1; }
.empty { text-align:center; padding:54px 20px; color:#bbb; }
.empty .ico { font-size:40px; margin-bottom:8px; }
.update-info { padding:7px 32px; font-size:11px; color:#bbb; text-align:right; }
</style>
</head>

<div class="header">
  <div>
    <h1>CRM Brogas Mayorista</h1>
    <div class="sub">brogas1958.com/mayoristas · Infomayorista@brogas.com</div>
  </div>
  <div class="stats">
    <div class="sbox"><div class="n" id="sTotal">0</div><div class="l">Total</div></div>
    <div class="sbox"><div class="n" id="sNuevos">0</div><div class="l">Nuevos</div></div>
    <div class="sbox or"><div class="n" id="sEnviados">0</div><div class="l">Enviados</div></div>
    <div class="sbox pu"><div class="n" id="sSeg">0</div><div class="l">Seguimiento</div></div>
    <div class="sbox go"><div class="n" id="sConv">0</div><div class="l">Convertidos</div></div>
  </div>
</div>

<div class="tabs">

</div>

<div class="controls">

  <select class="filter"     id="filterVendedor"><option value="">Todos los vendedores</option></select>
  <select class="filter"     id="filterProvincia"><option value="">Todas las provincias</option></select>
  <select class="filter"     id="filterRubro"><option value="">Todos los rubros</option></select>
</div>

<div class="table-container">
  <table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="update-info" id="updateInfo"></div>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="convModal">
  <div class="modal">
    <h3>🏆 Registrar conversión</h3>
    <div class="msub" id="modalSub"></div>
    <label>Monto de la venta ($)</label>
    <input type="number" id="inMonto" placeholder="Ej: 150000" min="0">
    <label>Fecha de conversión</label>
    <input type="date" id="inFecha">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-ok"     onclick="confirmConv()">✔ Confirmar</button>
    </div>
  </div>
</div>

// ══════════════════════════════════════════════════════════════
//  ESTADOS AUTOMÁTICOS (actualizados por la tarea programada)
//  El sistema escribe acá cuando envía WPP al vendedor.
//  Tiene prioridad sobre cualquier valor en localStorage.
// ══════════════════════════════════════════════════════════════
const AUTO_ESTADO = {
  "19d6cfcb5b9c1e57": "enviado",
  "19d69bf585aefc37": "enviado"
};

// ══════════════════════════════════════════════════════════════
//  ESTADO PERSISTENTE (localStorage con fallback seguro)
// ══════════════════════════════════════════════════════════════
function lsGet(key, def) {
  try { return JSON.parse(localStorage.getItem(key) || def); }
  catch(e) { return JSON.parse(def); }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

let leadEstado       = lsGet('brg_estado',   '{}');
let vendedorOverrides= lsGet('brg_vendedor', '{}');
let conversionData   = lsGet('brg_conv',     '{}');

function save() {
  lsSet('brg_estado',   leadEstado);
  lsSet('brg_vendedor', vendedorOverrides);
  lsSet('brg_conv',     conversionData);
}

// ══════════════════════════════════════════════════════════════
//  HELPERS  (todos null-safe con || '')
// ══════════════════════════════════════════════════════════════
function s(v){ return (v || ''); }  // safe string

function cleanTel(t){ return s(t).replace(/[\s\-\(\)\.�]/g,''); }

function getProv(tel) {
  let c = cleanTel(tel);
  if (c.startsWith("549")) c = c.slice(3);
  else if (c.startsWith("54")) c = c.slice(2);
  if (c.startsWith("0")) c = c.slice(1);
  for (let l = 4; l >= 2; l--) {
    const k = c.slice(0, l);
    if (PROV_MAP[k]) return PROV_MAP[k];
  }
  return "SIN DATOS";
}

function getDefaultVendName(lead) {
  const prov = getProv(lead.telefono);
  const idx  = leads.indexOf(lead);
  if (prov === "BUENOS AIRES")    return BA_ROTATION[idx % BA_ROTATION.length];
  if (prov === "CAPITAL FEDERAL") return CABA_ROTATION[idx % CABA_ROTATION.length];
  return PROV_VEND[prov] || "ARENTSEN PAULA INGRID";
}

function getVend(lead) {
  const name = vendedorOverrides[lead.messageId] || getDefaultVendName(lead);
  return VENDEDORES.find(v => v.nombre === name) || VENDEDORES[1];
}

function getEstado(mid) { return AUTO_ESTADO[mid] || leadEstado[mid] || 'nuevo'; }

function fmtPeso(n) { return (n != null && n !== '') ? '$' + Number(n).toLocaleString('es-AR') : 'Sin monto'; }

function buildVendorMsg(lead, vend) {
  const nom = [lead.nombre, lead.apellido].filter(Boolean).join(' ');
  const lines = [
    `Hola ${vend.nombre.split(' ')[0]}, te paso los datos de un cliente que se contactó a través de la web mayorista de Brogas:`,
    ``,
    `👤 Nombre: ${s(nom)}`,
    `🏢 Razón Social: ${s(lead.razon_social)}`,
    `🔢 CUIT: ${s(lead.cuit)}`,
    `📞 Tel: ${s(lead.telefono)}`,
    `📧 Email: ${s(lead.email)}`,
    `🏷️ Rubro: ${s(lead.rubro)}`
  ];
  if (lead.comentarios) lines.push(`💬 Comentarios: ${lead.comentarios}`);
  lines.push(``, `¡Por favor ponete en contacto a la brevedad! 🙌`);
  return lines.join('\n');
}

function toast(t) {
  const e = document.getElementById('toast');
  e.textContent = t;
  e.classList.add('show');
  setTimeout(() => e.classList.remove('show'), 2800);
}

// ══════════════════════════════════════════════════════════════
//  WORKFLOW ACTIONS
// ══════════════════════════════════════════════════════════════
function enviarVendedor(mid) {
  leadEstado[mid] = 'enviado';
  save();
  applyFilters();
  toast('📤 Enviado al vendedor · pasó a "Enviados"');
}

function vendedorContacto(mid) {
  leadEstado[mid] = 'seguimiento';
  save();
  applyFilters();
  toast('📞 Marcado: el vendedor se contactó · pasó a "Seguimiento"');
}

function changeVend(sel, mid) {
  const lead = leads.find(l => l.messageId === mid);
  if (sel.value === getDefaultVendName(lead)) {
    delete vendedorOverrides[mid];
    sel.classList.remove('ov');
  } else {
    vendedorOverrides[mid] = sel.value;
    sel.classList.add('ov');
  }
  save();
  toast('Vendedor reasignado → ' + sel.value);
}

function copyMsg(btn, mid) {
  const lead = leads.find(l => l.messageId === mid);
  const msg  = buildVendorMsg(lead, getVend(lead));
  const markCopied = () => {
    btn.classList.add('copied'); btn.innerHTML = '✓ Copiado';
    toast('Mensaje para el vendedor copiado ✓');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '📋 Mensaje'; }, 2200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(msg).then(markCopied).catch(() => fallbackCopy(msg, markCopied));
  } else {
    fallbackCopy(msg, markCopied);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  cb();
}

// ── Modal conversión ──────────────────────────────────────────
let _mid = null;
function openModal(mid) {
  _mid = mid;
  const lead = leads.find(l => l.messageId === mid);
  document.getElementById('modalSub').textContent =
    [lead.nombre, lead.apellido].filter(Boolean).join(' ') + ' · ' + s(lead.razon_social);
  document.getElementById('inMonto').value = conversionData[mid] ? conversionData[mid].monto : '';
  document.getElementById('inFecha').value = conversionData[mid] ? conversionData[mid].fecha  : new Date().toISOString().split('T')[0];
  document.getElementById('convModal').classList.add('open');
}
function closeModal() { document.getElementById('convModal').classList.remove('open'); _mid = null; }
function confirmConv() {
  if (!_mid) return;
  conversionData[_mid] = {
    monto: document.getElementById('inMonto').value,
    fecha: document.getElementById('inFecha').value
  };
  leadEstado[_mid] = 'convertido';
  save(); closeModal(); applyFilters();
  toast('🏆 Conversión registrada');
}

//  TABS
// ══════════════════════════════════════════════════════════════
let currentTab = 'nuevos';
function switchTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  applyFilters();
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════
const HEADS = {
  nuevos:      ['Acción','Estado','Fecha','Apellido / Nombre','Razón Social','CUIT','Email','Teléfono','Rubro','Provincia','Vendedor','Comentarios','Contacto vendedor'],
  enviados:    ['Acción','Estado','Fecha','Apellido / Nombre','Razón Social','CUIT','Email','Teléfono','Rubro','Provincia','Vendedor','Comentarios','Contacto vendedor'],
  seguimiento: ['Acción','Estado','Fecha','Apellido / Nombre','Razón Social','CUIT','Email','Teléfono','Rubro','Provincia','Vendedor','Conversión','Comentarios','Contacto vendedor']
};
const BADGE_META = {
  nuevo:       ['b-nuevo',       '0��� Nuevo'],
  enviado:     ['b-enviado',     '📤 Enviado'],
  seguimiento: ['b-seguimiento', '📞 Seguimiento'],
  convertido:  ['b-convertido',  '🏆 Convertido']
};

function renderTable(data) {
  document.getElementById('thead').innerHTML = HEADS[currentTab].map(h => `<th>${h}</th>`).join('');
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (!data.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="${HEADS[currentTab].length}"><div class="empty"><div class="ico">📭</div><p>No hay leads en esta sección</p></div></td>`;
    tbody.appendChild(tr);
    updateStats();
    return;
  }

  data.forEach(lead => {
    const mid    = lead.messageId;
    const estado = getEstado(mid);
    const prov   = getProv(lead.telefono);
    const vend   = getVend(lead);
    const over   = !!vendedorOverrides[mid];
    const [bc, bl] = BADGE_META[estado] || BADGE_META.nuevo;

    const vOpts = VENDEDORES.map(v =>
      `<option value="${v.nombre}"${v.nombre === vend.nombre ? ' selected' : ''}>${v.nombre}</option>`
    ).join('');

    const vPhone  = vend.tel ? '54' + vend.tel : '';
    const vMsgEnc = encodeURIComponent(buildVendorMsg(lead, vend));
    const wppLink = vPhone
      ? `https://wa.me/${vPhone}?text=${vMsgEnc}`
      : `https://wa.me/?text=${vMsgEnc}`;

    // First column: workflow action button
    let actionBtn = '';
    if      (estado === 'nuevo')       actionBtn = `<button class="btn btn-enviar"   onclick="enviarVendedor('${mid}')">📤 Enviar a vendedor</button>`;
    else if (estado === 'enviado')     actionBtn = `<button class="btn btn-contacto" onclick="vendedorContacto('${mid}')">📞 Vendedor se contactó</button>`;
    else if (estado === 'seguimiento') actionBtn = `<button class="btn btn-conv"     onclick="openModal('${mid}')">🏆 Convirtió</button>`;
    else if (estado === 'convertido')  actionBtn = `<button class="btn btn-edit"     onclick="openModal('${mid}')">✏️ Editar conversión</button>`;

    // Conversion column (seguimiento tab only)
    let convCol = '';
    if (currentTab === 'seguimiento') {
      const cd = conversionData[mid];
      convCol = (estado === 'convertido' && cd)
        ? `<td><div class="cv-monto">${fmtPeso(cd.monto)}</div><div class="cv-fecha">📅 ${cd.fecha || '—'}</div></td>`
        : `<td><span style="color:#ccc;font-size:11px">— pendiente</span></td>`;
    }

    const coment = s(lead.comentarios).replace(/"/g, '&quot;');
    const tr = document.createElement('tr');
    if (estado === 'convertido') tr.classList.add('row-conv');
    tr.innerHTML = `
      <td class="action-col">${actionBtn}</td>
      <td><span class="badge ${bc}">${bl}</span></td>
      <td style="white-space:nowrap">${s(lead.fecha)}</td>
      <td><div class="ap">${s(lead.apellido) || '—'}</div><div class="nm">${s(lead.nombre)}</div></td>
      <td><strong>${s(lead.razon_social) || '—'}</strong></td>
      <td style="font-family:monospace;font-size:11.5px">${s(lead.cuit) || '—'}</td>
      <td><a href="mailto:${s(lead.email)}" style="color:#1d4ed8;font-size:11.5px">${s(lead.email) || '—'}</a></td>
      <td style="white-space:nowrap">${s(lead.telefono) || '—'}</td>
      <td style="font-size:12px">${s(lead.rubro) || '—'}</td>
      <td><span class="badge b-prov">${prov}</span></td>
      <td>
        <select class="sel-vend${over ? ' ov' : ''}" onchange="changeVend(this,'${mid}')">
          ${vOpts}
        </select>
        ${over ? '<div class="ov-label">✏️ Reasignado manualmente</div>' : ''}
      </td>
      ${convCol}
      <td class="cc" title="${coment}">${s(lead.comentarios) || '—'}</td>
      <td>
        <div class="actions">
          <button class="btn btn-copy" onclick="copyMsg(this,'${mid}')">📋 Mensaje</button>
          <a class="btn btn-wpp" href="${wppLink}" target="_blank">💬 WPP</a>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });

  updateStats();
}

function updateStats() {
  const cnt = st => leads.filter(l => getEstado(l.messageId) === st).length;
  const n = cnt('nuevo'), en = cnt('enviado'), seg = cnt('seguimiento'), conv = cnt('convertido');
  document.getElementById('sTotal').textContent         = leads.length;
  document.getElementById('sNuevos').textContent        = n;
  document.getElementById('sEnviados').textContent      = en;
  document.getElementById('sSeg').textContent           = seg + conv;
  document.getElementById('sConv').textContent          = conv;
  document.getElementById('cnt-nuevos').textContent     = n;
  document.getElementById('cnt-enviados').textContent   = en;
  document.getElementById('cnt-seguimiento').textContent= seg + conv;
}

// ══════════════════════════════════════════════════════════════
//  FILTROS  (todos los campos con s() para evitar null errors)
// ══════════════════════════════════════════════════════════════
function tabLeads() {
  if (currentTab === 'nuevos')      return leads.filter(l => getEstado(l.messageId) === 'nuevo');
  if (currentTab === 'enviados')    return leads.filter(l => getEstado(l.messageId) === 'enviado');
  if (currentTab === 'seguimiento') return leads.filter(l => ['seguimiento','convertido'].includes(getEstado(l.messageId)));
  return leads;
}

function applyFilters() {
  const q  = s(document.getElementById('searchInput').value).toLowerCase();
  const fV = document.getElementById('filterVendedor').value;
  const fP = document.getElementById('filterProvincia').value;
  const fR = document.getElementById('filterRubro').value;

  const out = tabLeads().filter(lead => {
    const p = getProv(lead.telefono);
    const v = getVend(lead).nombre;
    const hayMatch = !q ||
      (s(lead.nombre) + ' ' + s(lead.apellido)).toLowerCase().includes(q) ||
      s(lead.razon_social).toLowerCase().includes(q)  ||
      s(lead.cuit).toLowerCase().includes(q)          ||
      s(lead.email).toLowerCase().includes(q)         ||
      s(lead.telefono).includes(q)                    ||
      p.toLowerCase().includes(q)                     ||
      s(lead.rubro).toLowerCase().includes(q);
    return hayMatch && (!fV || v === fV) && (!fP || p === fP) && (!fR || lead.rubro === fR);
  });

  renderTable(out);
}

function populateFilters() {
  const provs  = [...new Set(leads.map(l => getProv(l.telefono)))].sort();
  const rubros = [...new Set(leads.map(l => s(l.rubro)).filter(Boolean))].sort();
  const fp = document.getElementById('filterProvincia');
  provs.forEach(p => { fp.innerHTML += `<option value="${p}">${p}</option>`; });
  const fv = document.getElementById('filterVendedor');
  VENDEDORES.forEach(v => { fv.innerHTML += `<option value="${v.nombre}">${v.nombre}</option>`; });
  const fr = document.getElementById('filterRubro');
  rubros.forEach(r => { fr.innerHTML += `<option value="${r}">${r}</option>`; });
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
['searchInput','filterVendedor','filterProvincia','filterRubro'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input',  applyFilters);
  el.addEventListener('change', applyFilters);
});
document.getElementById('convModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

populateFilters();
applyFilters();
document.getElementById('updateInfo').textContent =
  'Última actualización: ' + new Date().toLocaleString('es-AR', { timeZone:'America/Argentina/Buenos_Aires' });
</script>
